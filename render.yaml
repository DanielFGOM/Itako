services:
  - type: web
    name: itako
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: itako
      - key: JWT_SECRET
        sync: false
      - key: ITAKO_ADMIN_EMAIL
        value: Itakotaqueria@gmail.com
      - key: ITAKO_ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
